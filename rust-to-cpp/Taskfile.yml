# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: Build Rust library
    cmds:
      - task: cargo

  # -- Rust tasks

  cargo:
    desc: Build the Rust library (default release mode)
    cmds:
      - task: cargo-release

  cargo-debug:
    desc: Build the Rust library in debug mode
    cmds:
      - cargo build

  cargo-release:
    desc: Build the Rust library in release mode
    cmds:
      - cargo build --release

  # -- C++-related tasks

  cpp:
    desc: Build the C++ extension (default release mode)
    cmds:
      - task: cpp-release

  cpp-debug:
    desc: Build the C++ extension in debug mode
    cmds:
      - cargo build --release
      - cmake -B build/Debug -DCMAKE_BUILD_TYPE=Debug
      - cmake --build build/Debug

  cpp-release:
    desc: Build the C++ extension in release mode
    cmds:
      - cargo build --release
      - cmake -B build/Release -DCMAKE_BUILD_TYPE=Release
      - cmake --build build/Release


  # -- Cleanup tasks

  clean:
    desc: Clean build and run artifacts
    cmds:
      - cargo clean
      - rm -rf build
      - rm -rf .cache
      - rm -rf results
      - rm -rf .venv
      - rm -f *.pyi
